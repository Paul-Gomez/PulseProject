services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pulse}
      POSTGRES_USER: ${DB_USERNAME:-pulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulse}
    ports:
      - "5432:5432"
    volumes:
      - pulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pulse}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pulsesecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pulse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pulse}
      DB_USERNAME: ${DB_USERNAME:-pulse}
      DB_PASSWORD: ${DB_PASSWORD:-pulse}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8100}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pulse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pulsesecret}
    ports:
      - "8080:8080"

volumes:
  pulse_postgres_data:
  pulse_minio_data:
