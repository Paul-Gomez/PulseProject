services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pulse}
      POSTGRES_USER: ${DB_USERNAME:-pulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. The minio/minio image is no longer published on Docker Hub;
  # RustFS speaks the same S3 API, so the backend still uses the MinIO Java client unchanged.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pulse}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-pulsesecret}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
    volumes:
      - pulse_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pulse}
      DB_USERNAME: ${DB_USERNAME:-pulse}
      DB_PASSWORD: ${DB_PASSWORD:-pulse}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8100,http://localhost:3000}
      MINIO_ENDPOINT: http://storage:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pulse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pulsesecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-pulse-attachments}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  pulse_postgres_data:
  pulse_storage_data:
