spring:
  application:
    name: pulse-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${DB_USERNAME:pulse}
    password: ${DB_PASSWORD:pulse}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

pulse:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-in-every-environment-min-32-bytes}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100}
  mail:
    # false = emails are printed in the log (development). In production set MAIL_ENABLED=true and SPRING_MAIL_HOST etc.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@pulse.local}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  storage:
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:10485760}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:pulse}
      secret-key: ${MINIO_SECRET_KEY:pulsesecret}
      bucket: ${MINIO_BUCKET:pulse-attachments}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
