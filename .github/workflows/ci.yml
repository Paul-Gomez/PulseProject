name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit + integration tests. Testcontainers starts real Postgres, Redis and RustFS
      # using the Docker that GitHub runners already have.
      - name: Test and package
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --configuration production

  mobile:
    name: Mobile (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - name: Production build
        run: npx ng build --configuration production

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pulse-backend ./backend
      - name: Build frontend image
        run: docker build -t pulse-frontend ./frontend
