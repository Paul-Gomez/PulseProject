server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # REST API -> backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
    }

    # WebSocket (STOMP) -> backend container. The Upgrade headers turn the HTTP request into a WebSocket.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Single Page App: unknown paths (e.g. /w/123/c/456) are handled by Angular's router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles never change, so the browser can cache them for a long time.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
